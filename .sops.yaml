# Generate the workstation's age public key on the target machine with:
#   ssh-keyscan -t ed25519 localhost 2>/dev/null | ssh-to-age
# Or directly from the host public key:
#   ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub
#
# Replace the placeholder age1... key below, then create/edit secrets with:
#   sops secrets/secrets.yaml

keys:
  - &workstation age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

creation_rules:
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - *workstation
